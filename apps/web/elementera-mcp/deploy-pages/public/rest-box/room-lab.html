<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>休憩箱 · 造物间</title>
<style>
:root{color-scheme:light dark;--bg:#f4eee3;--paper:#faf6eb;--ink:#6d5b47;--line:#d9cbb5;--active:#e7d9be}
@media(prefers-color-scheme:dark){:root{--bg:#2e2b27;--paper:#38342e;--ink:#e4d9c6;--line:#665c4f;--active:#514738}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui}main{max-width:660px;margin:auto;padding:12px}h1{font-size:16px;margin:4px 0 12px}h2{font-size:13px;font-weight:600;margin:14px 0 7px}button,input,select{font:inherit;color:inherit}button,select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px}button[aria-pressed=true]{background:var(--active)}button:disabled{opacity:.5}button{cursor:pointer}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}#scene{background:#faf6eb;border-radius:12px;width:min(100%,56vh);margin:auto}#scene.editing{touch-action:none}#scene img[data-instance]{cursor:grab}.list{max-height:190px;overflow:auto}.list button{width:100%;text-align:left;margin-bottom:4px}.catalog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:280px;overflow:auto}.catalog button{min-width:0;font-size:11px;padding:4px;overflow-wrap:anywhere}.catalog img{width:100%;height:62px;object-fit:contain;display:block}.muted{font-size:11px;opacity:.8;line-height:1.65}.palette{display:flex;align-items:center;gap:6px}.palette input{width:32px;height:30px;padding:0;border:0}.error{color:#a96554}#status{min-height:1.4em}input[type=range]{max-width:120px}
 .creature-preview{height:210px;width:100%;object-fit:contain;display:block;background:var(--paper);border-radius:10px}.creature-panes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.creature-scroll{max-height:260px;overflow:auto}.creature-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.creature-editor-box{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
</style></head><body><main><h1>休憩箱 · 造物间</h1><div class="tabs" id="rooms"></div><div id="scene"></div><div class="row"><button id="edit">布置房间</button><button id="pets">坐卧演示</button><button id="motion">暂停动画</button><button id="appearance">动物形象</button><button id="reset">恢复本房默认</button></div><div class="row" id="poseSlots" hidden></div><p id="status" aria-live="polite" class="muted"></p>
<section id="creatureEditor" hidden></section><section id="editor" hidden><div class="row"><strong id="selected">未选中家具</strong></div><div class="row"><label>大小 <input type="range" id="scale" min=".1" max="4" step=".05"></label><button data-op="mirror">镜像</button><button data-op="copy">复制</button><button data-op="visible">隐藏/显示</button><button data-op="delete">移除</button></div><div class="row"><button data-layer="top">置顶</button><button data-layer="up">上移</button><button data-layer="down">下移</button><button data-layer="bottom">置底</button></div><div class="row" id="colors"></div><h2>图层 · 前景在上</h2><div id="layers" class="list"></div><h2>家具库</h2><div id="families" class="row"></div><div id="catalog" class="catalog"></div></section>
<div class="row"><button id="export">导出房间与形象 JSON</button><label>导入 <input id="import" type="file" accept=".json,application/json"></label></div><p class="muted">独立美术空间。房间与动物形象自动保存在当前设备的浏览器空间，可导出 JSON 备份。所有试穿、动作与坐卧只用于美术预览，不产生真实模型活动或互动记录。家具采用内置原稿。</p></main>
<script type="module" src="./room-lab.mjs"></script></body></html>
