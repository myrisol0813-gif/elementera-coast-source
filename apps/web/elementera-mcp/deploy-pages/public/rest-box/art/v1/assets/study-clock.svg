<clipPath id="studywindow"><rect x="188" y="43" width="137" height="114" rx="3"/></clipPath></defs><style>.painted{filter:url(#paperGrain) url(#edge)}.studyCurtain{transform-origin:182px 36px;animation:curtain 6.5s ease-in-out infinite}.leaf{transform-origin:bottom;transform-box:fill-box;animation:leaf 5s ease-in-out infinite}.steam{animation:steam 3.5s ease-in-out infinite}.light{animation:light 6s ease-in-out infinite}@keyframes curtain{50%{transform:skewX(-2.5deg)}}@keyframes leaf{50%{transform:rotate(3deg)}}@keyframes steam{0%,100%{opacity:.1;transform:translateY(4px)}40%{opacity:.7}80%{opacity:.2;transform:translateY(-8px)}}@keyframes light{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(-341 -94)"><g data-part="back"><g id="study-clock" class="painted"><path d="M349 108Q365 92 381 108L382 157Q368 174 350 158Z" fill="#a2825b"/><path d="M354 112Q365 103 376 112L377 153Q367 165 355 154Z" fill="#c0a17a"/><circle cx="365.5" cy="125" r="13" fill="#f1e5cb"/><path d="M365 115V118M365 132V135M355 125H358M373 125H376M365 125L365 118M365 125L372 128" stroke="#9b896b" stroke-width="1.3" stroke-linecap="round"/><path d="M361 145H371V155H361Z" fill="#967b58"/><path d="M366 143V151" stroke="#d4b67c" stroke-width="1.6"/><circle cx="366" cy="152" r="3.4" fill="#dcc18a"/></g></g></g></svg>