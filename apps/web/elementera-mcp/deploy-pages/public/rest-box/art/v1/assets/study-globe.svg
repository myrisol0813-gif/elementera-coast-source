<clipPath id="studywindow"><rect x="188" y="43" width="137" height="114" rx="3"/></clipPath></defs><style>.painted{filter:url(#paperGrain) url(#edge)}.studyCurtain{transform-origin:182px 36px;animation:curtain 6.5s ease-in-out infinite}.leaf{transform-origin:bottom;transform-box:fill-box;animation:leaf 5s ease-in-out infinite}.steam{animation:steam 3.5s ease-in-out infinite}.light{animation:light 6s ease-in-out infinite}@keyframes curtain{50%{transform:skewX(-2.5deg)}}@keyframes leaf{50%{transform:rotate(3deg)}}@keyframes steam{0%,100%{opacity:.1;transform:translateY(4px)}40%{opacity:.7}80%{opacity:.2;transform:translateY(-8px)}}@keyframes light{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(-41 -17)"><g data-part="back"><g id="globe" class="painted"><ellipse cx="73" cy="85" rx="24" ry="5" fill="#a08b62" opacity=".2"/><path d="M71 67L77 67L78 81L85 83Q75 89 64 84L71 80Z" fill="#ae8c5d"/><path d="M56 32Q38 45 51 66Q62 78 79 68Q96 59 92 42" stroke="#ad8c5b" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="71" cy="47" r="24" fill="#91acac"/><path d="M55 30Q66 25 71 34L65 42L71 47L65 56L58 49L49 47Q47 39 55 30Z M77 27Q92 32 94 46L86 47L82 58L73 54L75 43L81 36Z M63 61Q72 55 77 64L74 69Q66 72 63 61Z" fill="#c1c2a0"/><path d="M49 42Q69 52 93 44M68 24Q57 47 72 70M78 25Q91 50 81 66" stroke="#d2d8c4" stroke-width="1" opacity=".67" fill="none"/></g></g></g></svg>