<clipPath id="studywindow"><rect x="188" y="43" width="137" height="114" rx="3"/></clipPath></defs><style>.painted{filter:url(#paperGrain) url(#edge)}.studyCurtain{transform-origin:182px 36px;animation:curtain 6.5s ease-in-out infinite}.leaf{transform-origin:bottom;transform-box:fill-box;animation:leaf 5s ease-in-out infinite}.steam{animation:steam 3.5s ease-in-out infinite}.light{animation:light 6s ease-in-out infinite}@keyframes curtain{50%{transform:skewX(-2.5deg)}}@keyframes leaf{50%{transform:rotate(3deg)}}@keyframes steam{0%,100%{opacity:.1;transform:translateY(4px)}40%{opacity:.7}80%{opacity:.2;transform:translateY(-8px)}}@keyframes light{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(-263 -153)"><g data-part="back"><g id="study-cup" class="painted"><ellipse cx="286" cy="217" rx="17" ry="5.8" fill="#8ba7a6"/><path d="M292 202Q306 196 305 207Q303 212 294 211" fill="none" stroke="#a1bcb7" stroke-width="4"/><path d="M275 201L296 200L293 214Q285 220 278 214Z" fill="#b1c6bf"/><ellipse cx="285" cy="201" rx="10.5" ry="3.8" fill="#f2e3c9"/><ellipse cx="285" cy="202" rx="8" ry="2.4" fill="#95694c"/><path class="steam" d="M283 195Q276 187 284 180Q291 174 286 169" stroke="#b9aa91" stroke-width="2" fill="none" stroke-linecap="round"/></g></g></g></svg>