<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 160" role="img" aria-label="碎花沙发"><defs>
<filter id="paperGrain" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".64" numOctaves="3" seed="32" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .41 0 0 0 0 .30 0 0 0 0 .23 .20 .20 .20 0 -.14" result="p"/><feComposite in="p" in2="SourceGraphic" operator="in" result="t"/><feBlend in="SourceGraphic" in2="t" mode="multiply"/></filter>
<filter id="furPaint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".24 .55" numOctaves="3" seed="81" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .64 0 0 0 0 .56 0 0 0 0 .70 .22 .22 .22 0 -.15" result="p"/><feComposite in="p" in2="SourceGraphic" operator="in" result="t"/><feBlend in="SourceGraphic" in2="t" mode="multiply"/></filter>
<filter id="scalePaint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".32 .58" numOctaves="3" seed="45" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .69 0 0 0 0 .61 0 0 0 0 .62 .16 .16 .16 0 -.08" result="p"/><feComposite in="p" in2="SourceGraphic" operator="in" result="t"/><feBlend in="SourceGraphic" in2="t" mode="screen"/></filter>
<filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".085" numOctaves="3" seed="14" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.25" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
<linearGradient id="wood" x2="1" y2=".8"><stop stop-color="#b58b5e"/><stop offset=".5" stop-color="#956b43"/><stop offset="1" stop-color="#805735"/></linearGradient>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#a9c4cf"/><stop offset="1" stop-color="#e8dfbd"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#ffdb89" stop-opacity=".44"/><stop offset="1" stop-color="#ffdb89" stop-opacity="0"/></radialGradient>
<pattern id="check" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)"><rect width="20" height="20" fill="#d7a34d"/><path d="M0 5H20M5 0V20" stroke="#f5e6b0" stroke-width="10" opacity=".64"/><rect width="10" height="10" fill="#fff5d0" opacity=".4"/><path d="M0 13H20M13 0V20" stroke="#f6d385" stroke-width="1" opacity=".6"/></pattern>
<pattern id="curtaincloth" width="23" height="29" patternUnits="userSpaceOnUse"><rect width="23" height="29" fill="#ead4ae"/><path d="M8 19Q16 13 15 7M10 16Q3 13 4 10Q10 10 10 16M13 13Q21 12 20 8Q15 8 13 13" fill="#9ba17a"/><path d="M12 8Q6 5 10 2Q14 1 15 5Q20 2 21 6Q20 10 15 11Z" fill="#c77e72"/><circle cx="3" cy="24" r="1.3" fill="#c7ad7b"/></pattern>
<pattern id="flowercloth" width="28" height="26" patternUnits="userSpaceOnUse"><rect width="28" height="26" fill="#83935c"/><path d="M10 21Q12 13 12 8M12 17Q4 17 5 12Q10 12 12 17M12 15Q20 12 22 15Q19 19 12 15" fill="#b6bd83"/><path d="M12 2Q16 1 16 6Q23 4 21 10Q18 13 15 10Q15 16 10 13Q7 12 9 9Q2 10 4 5Q7 2 12 5Z" fill="#e9dbb0"/><circle cx="12" cy="8" r="2.3" fill="#d9a15c"/><circle cx="25" cy="23" r="1.6" fill="#d1cb92"/></pattern>
<pattern id="basket" width="10" height="7" patternUnits="userSpaceOnUse"><rect width="10" height="7" fill="#b58d55"/><path d="M0 2Q5 -1 10 2M0 5Q5 2 10 5" fill="none" stroke="#e0c28b" stroke-width="1.6"/><path d="M2 0V7M8 0V7" stroke="#947349" stroke-width=".85" opacity=".7"/></pattern>
<pattern id="rug" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(5)"><rect width="13" height="13" fill="#b5c1a2"/><path d="M0 3H13M0 9H13M3 0V13M9 0V13" stroke="#d7dbc0" stroke-width=".8" opacity=".5"/></pattern>
<clipPath id="win"><rect x="61" y="50" width="108" height="105" rx="2"/></clipPath><clipPath id="sofaFront"><path d="M35 237Q89 254 161 237L159 268Q103 288 40 267Z"/></clipPath>
</defs><style>.painted{filter:url(#paperGrain) url(#edge)}.gouache .w-paint{filter:url(#furPaint)}.gouache .s-paint{filter:url(#scalePaint)}
.leftCurtain{transform-origin:48px 42px;animation:curtainL 5.4s ease-in-out infinite}.rightCurtain{transform-origin:178px 42px;animation:curtainR 6.3s ease-in-out infinite}
.sea{animation:tide 8s linear infinite}.clouds{animation:cloud 28s ease-in-out infinite}.gulls{animation:gull 12s ease-in-out infinite}
.chime1{transform-origin:201px 30px;animation:chime 3.1s ease-in-out infinite}.chime2{transform-origin:212px 32px;animation:chime 3.8s ease-in-out infinite reverse;animation-delay:-.7s}.chime3{transform-origin:223px 30px;animation:chime 2.9s ease-in-out infinite;animation-delay:-1.2s}
.flowers{transform-origin:316px 94px;animation:sway 4.7s ease-in-out infinite}.bigplant{transform-origin:354px 265px;animation:sway 6s ease-in-out infinite}.leafL{transform-origin:354px 264px;animation:leaf 4.4s ease-in-out infinite}.leafR{transform-origin:354px 264px;animation:leaf 5.6s ease-in-out infinite reverse}
.steamA,.steamB{animation:steam 3.6s ease-out infinite}.steamB{animation-delay:-1.8s}.lampLight{transform-origin:204px 164px;animation:light 7s ease-in-out infinite}.quilt{transform-origin:223px 306px;animation:quilt 6.5s ease-in-out infinite}.dust1{animation:motes 10s ease-in-out infinite}.dust2{animation:motes 14s ease-in-out infinite reverse}
.strong .leftCurtain{animation-name:curtainLS;animation-duration:3.1s}.strong .rightCurtain{animation-name:curtainRS;animation-duration:3.9s}.strong .flowers,.strong .bigplant{animation-name:swayStrong;animation-duration:3s}.strong .chime1,.strong .chime2,.strong .chime3{animation-name:chimeStrong;animation-duration:1.9s}.strong .sea{animation-duration:4s}.strong .quilt{animation-duration:3s}
.still *,.hidden *{animation-play-state:paused!important}
@keyframes curtainL{50%{transform:skewX(-2.8deg) scaleX(1.035)}}@keyframes curtainR{50%{transform:skewX(3deg) scaleX(.97)}}@keyframes curtainLS{50%{transform:skewX(-6deg) scaleX(1.06)}}@keyframes curtainRS{50%{transform:skewX(7deg) scaleX(.94)}}
@keyframes chime{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}@keyframes chimeStrong{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(12deg)}}@keyframes tide{to{transform:translateX(54px)}}@keyframes cloud{50%{transform:translateX(24px)}}@keyframes gull{0%{transform:translate(-45px,5px);opacity:0}20%,80%{opacity:.85}100%{transform:translate(96px,-20px);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}@keyframes swayStrong{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(8deg)}}@keyframes leaf{50%{transform:rotate(4deg)}}@keyframes steam{0%{opacity:0;transform:translateY(6px)}30%{opacity:.6}100%{opacity:0;transform:translate(6px,-13px)}}@keyframes light{50%{opacity:.65;transform:scale(1.08)}}@keyframes quilt{50%{transform:skewX(-3deg)}}@keyframes motes{0%,100%{opacity:.25;transform:translate(0,4px)}50%{opacity:.7;transform:translate(11px,-12px)}}
@media(prefers-reduced-motion:reduce){#room *{animation:none!important}#s-tongue{display:none}}</style><g transform="translate(-4 -140)"><g data-part="back"><g id="sofa-back"><ellipse cx="96" cy="282" rx="83" ry="12" fill="#94836e" opacity=".17"/><g class="painted"><path d="M47 258L45 280Q52 285 58 280L66 261M141 259L143 280Q150 284 155 279L157 256" fill="#795338"/><path d="M38 225Q19 179 43 166Q62 151 99 155Q140 149 157 171Q173 189 158 232Z" fill="#86965e"/><path d="M45 219Q32 184 50 171Q72 156 102 162Q138 156 152 177L155 228Z" fill="url(#flowercloth)"/><path d="M43 224Q96 209 157 223L169 244Q104 264 31 244Z" fill="#a1ae76"/><path d="M35 237Q89 254 161 237L159 268Q103 288 40 267Z" fill="#788a51"/><g clip-path="url(#sofaFront)" opacity=".85"><rect x="30" y="235" width="143" height="51" fill="url(#flowercloth)"/></g><path d="M64 172Q81 178 97 167L107 208Q87 222 62 209Z" fill="url(#check)"/><path d="M67 175Q81 179 92 173M66 204Q86 214 103 205" stroke="#f6e4b3" stroke-width="3" opacity=".45" fill="none" stroke-linecap="round"/><path d="M113 187Q119 180 126 186Q136 180 140 188Q152 192 143 201Q149 210 137 215Q129 224 121 216Q109 219 106 209Q98 202 108 196Z" fill="#d8a099"/><circle cx="127" cy="202" r="9" fill="#eed3a3"/></g></g></g><g data-part="front"><g id="sofa-front" class="painted"><path d="M36 269Q16 261 17 228Q15 207 28 200Q44 192 53 206Q63 222 57 246L57 275Z" fill="#7d8f57"/><path d="M24 234Q17 211 29 205Q42 200 49 212Q55 224 49 239Z" fill="url(#flowercloth)"/><path d="M143 244Q139 220 145 207Q154 195 167 201Q182 207 181 229L176 260L157 274L144 267Z" fill="#83945b"/><path d="M149 231Q144 211 156 205Q168 201 175 216L175 232Z" fill="url(#flowercloth)"/><path d="M64 232Q103 241 141 232M23 243Q22 255 29 262M163 240L160 260" fill="none" stroke="#c0c78f" stroke-width="2.2" opacity=".52" stroke-linecap="round"/></g></g></g></svg>