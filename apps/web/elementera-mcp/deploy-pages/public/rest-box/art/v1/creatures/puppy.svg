<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 320 260">
<!-- V13 original geometry from chat, extracted from the UI wrapper. Use setMood(mood,droop) when mounted in an interactive SVG document. -->
<style>
#pet{transform-origin:160px 218px;animation:breathe 3s infinite ease-in-out}
#headTilt{transform-origin:160px 148px;transition:transform .45s ease}
#tail{transform-origin:195px 191px;animation:wag 2.3s infinite ease-in-out}
#eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
#outerEar,#innerEar{transition:d .55s ease-in-out}
#earL{transform-origin:115px 88px}#earR{transform-origin:205px 88px}
#sadEyes,#happyEyes,#clingEyes,#sleepEyes,#sadMouth,#happyMouth,#sleepMouth,#raised,#hearts,#tear,#sparkles,#hat,#zzz{display:none}
.sad #eyes,.sad #mouth,.cheer #eyes,.cheer #mouth,.cheer #hands,.cling #eyes,.sleep #eyes,.sleep #mouth{display:none}
.sad #sadEyes,.sad #sadMouth,.sad #tear,.cheer #happyEyes,.cheer #happyMouth,.cheer #raised,.cheer #sparkles,.cling #clingEyes,.cling #hearts,.sleep #sleepEyes,.sleep #sleepMouth,.sleep #hat,.sleep #zzz{display:inline}
.sad #headTilt{transform:translateY(7px) rotate(-3deg)}
.sad #tail{animation:none;transform:rotate(14deg)}
.sad #pet{animation:sadBody 3s infinite}
.sad #hands{transform:translateY(5px)}
.cheer #pet{animation:hop .65s infinite}
.cheer #tail{animation:wag .3s infinite}
.cheer #pawL{animation:raise .4s infinite alternate}
.cheer #pawR{animation:raise .4s infinite alternate-reverse}
.cling #headTilt{animation:nuzzle 2s infinite ease-in-out}
.cling #tail{animation:wag .5s infinite}
.cling #hands{animation:plead 2s infinite}
.idle #earL,.sit #earL{animation:twitchL 6s infinite}
.idle #earR,.sit #earR{animation:twitchR 6s infinite}
.sit #pet{animation:sit 3s infinite}
.sleep #pet{animation:sleep 3.5s infinite}
.sleep #tail{animation:none}
.sleep #headTilt{transform:rotate(-5deg)}
#tear{animation:tear 3s infinite}
#hearts{animation:float 2s infinite}
#zzz{animation:float 3s infinite}
@keyframes breathe{50%{transform:scale(1.015,.984)}}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(13deg)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.07)}}
@keyframes twitchL{0%,15%,23%,100%{transform:rotate(0)}19%{transform:rotate(-9deg)}}
@keyframes twitchR{0%,58%,66%,100%{transform:rotate(0)}62%{transform:rotate(9deg)}}
@keyframes sadBody{0%,100%{transform:scale(1.03,.94)}50%{transform:scale(1.03,.96)}}
@keyframes hop{0%,100%{transform:scale(1.04,.96)}50%{transform:translateY(-13px) scale(.97,1.04)}}
@keyframes raise{to{transform:translateY(-10px)}}
@keyframes nuzzle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes plead{50%{transform:translateY(-6px)}}
@keyframes sit{0%,100%{transform:scale(1.05,.9)}50%{transform:scale(1.05,.92)}}
@keyframes sleep{0%,100%{transform:scale(1.16,.74)}50%{transform:scale(1.16,.78)}}
@keyframes tear{0%,15%{opacity:0;transform:translateY(-3px)}35%{opacity:1}85%,100%{opacity:0;transform:translateY(8px)}}
@keyframes float{50%{transform:translateY(-5px);opacity:.6}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<g id="earShape">
<path id="outerEar" d="M104 123C82 111 64 89 60 78C56 64 73 62 91 69C113 77 126 84 143 91C146 115 127 132 104 123Z" fill="#fcfaff"/>
<path id="innerEar" d="M86 96C76 89 69 79 70 77C80 74 96 84 113 92Q98 95 92 102Z" fill="#e6b2c6"/>
</g>
<g id="pad">
<circle r="18" fill="var(--paw)"/>
<ellipse cy="5" rx="9" ry="8" fill="var(--pad)"/>
<circle cx="-11" cy="-5" r="3.5" fill="var(--pad)"/>
<circle cx="-3" cy="-11" r="3.5" fill="var(--pad)"/>
<circle cx="5" cy="-11" r="3.5" fill="var(--pad)"/>
<circle cx="12" cy="-5" r="3.5" fill="var(--pad)"/>
</g>
<clipPath id="wardBodyClip"><path d="M160 111C127 111 112 145 116 178Q117 197 133 207Q133 216 145 216Q154 216 154 210Q160 211 166 210Q166 216 175 216Q187 216 187 207Q203 197 204 178C208 145 193 111 160 111Z" fill="black"/></clipPath></defs>
<ellipse cx="160" cy="222" rx="69" ry="7" fill="#55576e" opacity=".17"/>
<g id="scene" class="idle gold" style="--fur:#eac68d;--body:#dfb77d;--inner:#d2a56a;--tail:#d2a56a;--cheek:#f5dbb1;--belly:#dfb77d;--paw:#efd0a0;--eye:#665044;--ink:#665044;--pad:#d4a09b;--blush:#dfa39c;--ear:#d2a56a">
<g id="pet">
<g id="tail">
<path d="M185 185C207 185 223 173 234 157Q244 141 243 127C260 136 270 153 267 166Q275 163 273 172Q271 183 258 190Q267 191 258 199Q247 207 233 207Q242 213 228 216Q202 221 185 204Z" fill="var(--tail)"/></g>
<path d="M160 111C127 111 112 145 116 178Q117 197 133 207Q133 216 145 216Q154 216 154 210Q160 211 166 210Q166 216 175 216Q187 216 187 207Q203 197 204 178C208 145 193 111 160 111Z" fill="var(--body)"/>
<g transform="translate(0 -14)">
<g id="headTilt">
<g><path d="M83 119C83 87 104 74 139 72Q143 67 141 61Q154 62 160 71Q170 63 178 67L177 73C216 73 237 92 237 121C237 158 207 179 160 179C113 179 83 158 83 119Z" fill="var(--fur)"/></g><g><g transform="translate(0 9)"><path d="M119 78Q124 63 116 61Q109 63 101 69Q88 73 73 81Q61 89 69 107Q74 125 88 128Q102 130 108 109Q115 93 119 78Z" fill="var(--ear)"/><path d="M119 78Q124 63 116 61Q109 63 101 69Q88 73 73 81Q61 89 69 107Q74 125 88 128Q102 130 108 109Q115 93 119 78Z" transform="translate(320 0) scale(-1 1)" fill="var(--ear)"/></g><ellipse cx="160" cy="151" rx="29" ry="19" fill="var(--cheek)"/></g><g id="eyes" fill="var(--eye)">
<ellipse cx="137" cy="132" rx="9" ry="12"/><ellipse cx="183" cy="132" rx="9" ry="12"/>
<circle cx="134" cy="128" r="2.5" fill="white"/><circle cx="180" cy="128" r="2.5" fill="white"/>
</g>
<g id="sadEyes" fill="var(--eye)">
<path d="M128 119Q135 117 143 113M177 113Q185 117 192 119" fill="none" stroke="#77738d" stroke-width="3.5" stroke-linecap="round"/>
<ellipse cx="137" cy="134" rx="8" ry="10"/><ellipse cx="183" cy="134" rx="8" ry="10"/>
<circle cx="135" cy="137" r="3" fill="white"/><circle cx="181" cy="137" r="3" fill="white"/>
</g>
<g id="clingEyes" fill="var(--eye)">
<ellipse cx="137" cy="133" rx="12" ry="14"/><ellipse cx="183" cy="133" rx="12" ry="14"/>
<ellipse cx="133" cy="128" rx="4.5" ry="5.5" fill="white"/><ellipse cx="179" cy="128" rx="4.5" ry="5.5" fill="white"/>
<circle cx="143" cy="139" r="2.4" fill="#c5c9eb"/><circle cx="189" cy="139" r="2.4" fill="#c5c9eb"/>
</g>
<ellipse cx="116" cy="150" rx="9" ry="4" fill="var(--blush)"/><ellipse cx="204" cy="150" rx="9" ry="4" fill="var(--blush)"/>
<path d="M155 145Q160 142 165 145Q164 149 160 150Q156 149 155 145Z" fill="var(--eye)"/>
<path id="mouth" d="M160 149Q155 157 151 151M160 149Q165 157 169 151" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
<path id="sadMouth" d="M153 160Q160 151 167 160" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
<path id="happyEyes" d="M118 137Q130 120 142 135M178 135Q190 120 202 137" fill="none" stroke="var(--eye)" stroke-width="5.5" stroke-linecap="round"/>
<g id="happyMouth"><path d="M149 153Q160 158 171 153Q172 172 160 172Q148 172 149 153Z" fill="#9d6687"/><ellipse cx="160" cy="167" rx="7" ry="4" fill="#efaac2"/></g>
<path id="sleepEyes" d="M126 132Q137 143 148 132M172 132Q183 143 194 132" fill="none" stroke="#77738d" stroke-width="4" stroke-linecap="round"/>
<ellipse id="sleepMouth" cx="160" cy="158" rx="3.5" ry="4" fill="var(--ink)"/>
<path id="tear" d="M199 139Q192 150 194 154Q199 160 204 154Q206 150 199 139Z" fill="#a5c6ed"/>
<g id="hat">
<path d="M119 78Q120 45 138 25Q157 3 180 15Q202 24 212 48Q194 44 182 51L197 78Z" fill="#8f97c5"/>
<path d="M138 25Q157 3 180 15Q202 24 212 48Q193 38 177 41Q160 24 138 25Z" fill="#a3abd4"/>
<rect x="117" y="69" width="84" height="17" rx="8.5" fill="#dce0f0"/>
<path d="M145 40L148 47L156 48L150 53L152 61L145 57L138 61L140 53L134 48L142 47Z" fill="#f6e6b2"/>
<circle cx="174" cy="34" r="3" fill="#f6e6b2"/><circle cx="211" cy="49" r="10" fill="#f6f3fb"/>
</g>
</g>
</g>
<g id="hands" fill="var(--paw)"><circle cx="133" cy="176" r="16"/><circle cx="187" cy="176" r="16"/></g>
<g id="raised"><g id="pawL"><use href="#pad" x="89" y="131"/></g><g id="pawR"><use href="#pad" x="231" y="131"/></g></g>
</g>
<g id="hearts" fill="#d891b0"><path d="M56 78Q63 68 70 78Q77 68 84 78Q84 89 70 97Q56 89 56 78ZM252 61Q257 53 263 61Q269 53 274 61Q274 70 263 77Q252 70 252 61Z"/></g>
<g id="sparkles" stroke="#da98b8" stroke-width="4" stroke-linecap="round"><path d="M43 78V94M35 86H51M276 66V82M268 74H284M51 110L45 117M269 101L276 108"/></g>
<g id="zzz" fill="#77738d" font-family="sans-serif" font-weight="bold"><text x="242" y="91" font-size="15">z</text><text x="260" y="70" font-size="21">z</text><text x="278" y="46" font-size="26">Z</text></g>
</g>
</svg>