<clipPath id="studywindow"><rect x="188" y="43" width="137" height="114" rx="3"/></clipPath></defs><style>.painted{filter:url(#paperGrain) url(#edge)}.studyCurtain{transform-origin:182px 36px;animation:curtain 6.5s ease-in-out infinite}.leaf{transform-origin:bottom;transform-box:fill-box;animation:leaf 5s ease-in-out infinite}.steam{animation:steam 3.5s ease-in-out infinite}.light{animation:light 6s ease-in-out infinite}@keyframes curtain{50%{transform:skewX(-2.5deg)}}@keyframes leaf{50%{transform:rotate(3deg)}}@keyframes steam{0%,100%{opacity:.1;transform:translateY(4px)}40%{opacity:.7}80%{opacity:.2;transform:translateY(-8px)}}@keyframes light{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(-103 -114)"><g data-part="back"><g id="study-lamp" class="painted"><ellipse class="light" cx="165" cy="178" rx="58" ry="59" fill="url(#glow)"/><ellipse cx="151" cy="208" rx="22" ry="6" fill="#a38a62"/><ellipse cx="151" cy="205" rx="18" ry="4" fill="#c1a270"/><path d="M149 205Q144 174 156 151Q165 139 178 143" stroke="#ae8e5e" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M153 141Q164 125 189 129Q201 138 199 149Q175 157 151 149Z" fill="#74978e"/><path d="M153 146Q175 153 198 145L200 150Q177 162 151 151Z" fill="#aac0ad"/><path d="M160 139Q171 130 185 133" stroke="#bfd0b6" stroke-width="2.2" fill="none" stroke-linecap="round"/></g></g></g></svg>