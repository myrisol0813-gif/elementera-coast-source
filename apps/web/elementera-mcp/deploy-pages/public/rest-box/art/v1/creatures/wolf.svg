<path d="M86 110Q86 75 134 73Q146 72 151 73Q145 62 150 58Q162 60 165 71Q176 62 181 69L179 74Q234 72 234 110Q234 125 243 131Q260 135 253 144Q247 150 238 147Q250 156 241 162Q232 168 221 162Q202 179 160 179Q118 179 99 162Q88 168 79 162Q70 156 82 147Q73 150 67 144Q60 135 77 131Q86 125 86 110Z" fill="#fcfaff"/>
<g id="eyes" fill="#555269">
<ellipse cx="137" cy="132" rx="9" ry="12"/><ellipse cx="183" cy="132" rx="9" ry="12"/>
<circle cx="134" cy="128" r="2.5" fill="white"/><circle cx="180" cy="128" r="2.5" fill="white"/>
