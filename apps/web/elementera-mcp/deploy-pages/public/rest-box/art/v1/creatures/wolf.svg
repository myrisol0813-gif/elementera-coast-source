<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
<!-- V13 original geometry from chat, extracted from the UI wrapper. Use setMood(mood,droop) when mounted in an interactive SVG document. -->
<style>
#pet{transform-origin:160px 218px;animation:breathe 3s infinite ease-in-out}
#headTilt{transform-origin:160px 148px;transition:transform .45s ease}
#tail{transform-origin:195px 191px;animation:wag 2.3s infinite ease-in-out}
#eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
#outerEar,#innerEar{transition:d .55s ease-in-out}
#earL{transform-origin:115px 88px}#earR{transform-origin:205px 88px}
#sadEyes,#happyEyes,#clingEyes,#sleepEyes,#sadMouth,#happyMouth,#sleepMouth,#raised,#hearts,#tear,#sparkles,#hat,#zzz{display:none}
.sad #eyes,.sad #mouth,.cheer #eyes,.cheer #mouth,.cheer #hands,.cling #eyes,.sleep #eyes,.sleep #mouth{display:none}
.sad #sadEyes,.sad #sadMouth,.sad #tear,.cheer #happyEyes,.cheer #happyMouth,.cheer #raised,.cheer #sparkles,.cling #clingEyes,.cling #hearts,.sleep #sleepEyes,.sleep #sleepMouth,.sleep #hat,.sleep #zzz{display:inline}
.sad #headTilt{transform:translateY(7px) rotate(-3deg)}
.sad #tail{animation:none;transform:rotate(14deg)}
.sad #pet{animation:sadBody 3s infinite}
.sad #hands{transform:translateY(5px)}
.cheer #pet{animation:hop .65s infinite}
.cheer #tail{animation:wag .3s infinite}
.cheer #pawL{animation:raise .4s infinite alternate}
.cheer #pawR{animation:raise .4s infinite alternate-reverse}
.cling #headTilt{animation:nuzzle 2s infinite ease-in-out}
.cling #tail{animation:wag .5s infinite}
.cling #hands{animation:plead 2s infinite}
.idle #earL,.sit #earL{animation:twitchL 6s infinite}
.idle #earR,.sit #earR{animation:twitchR 6s infinite}
.sit #pet{animation:sit 3s infinite}
.sleep #pet{animation:sleep 3.5s infinite}
.sleep #tail{animation:none}
.sleep #headTilt{transform:rotate(-5deg)}
#tear{animation:tear 3s infinite}
#hearts{animation:float 2s infinite}
#zzz{animation:float 3s infinite}
@keyframes breathe{50%{transform:scale(1.015,.984)}}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(13deg)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.07)}}
@keyframes twitchL{0%,15%,23%,100%{transform:rotate(0)}19%{transform:rotate(-9deg)}}
@keyframes twitchR{0%,58%,66%,100%{transform:rotate(0)}62%{transform:rotate(9deg)}}
@keyframes sadBody{0%,100%{transform:scale(1.03,.94)}50%{transform:scale(1.03,.96)}}
@keyframes hop{0%,100%{transform:scale(1.04,.96)}50%{transform:translateY(-13px) scale(.97,1.04)}}
@keyframes raise{to{transform:translateY(-10px)}}
@keyframes nuzzle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes plead{50%{transform:translateY(-6px)}}
@keyframes sit{0%,100%{transform:scale(1.05,.9)}50%{transform:scale(1.05,.92)}}
@keyframes sleep{0%,100%{transform:scale(1.16,.74)}50%{transform:scale(1.16,.78)}}
@keyframes tear{0%,15%{opacity:0;transform:translateY(-3px)}35%{opacity:1}85%,100%{opacity:0;transform:translateY(8px)}}
@keyframes float{50%{transform:translateY(-5px);opacity:.6}}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<g id="earShape">
