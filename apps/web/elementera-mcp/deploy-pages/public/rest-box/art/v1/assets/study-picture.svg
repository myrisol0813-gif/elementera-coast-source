<clipPath id="studywindow"><rect x="188" y="43" width="137" height="114" rx="3"/></clipPath></defs><style>.painted{filter:url(#paperGrain) url(#edge)}.studyCurtain{transform-origin:182px 36px;animation:curtain 6.5s ease-in-out infinite}.leaf{transform-origin:bottom;transform-box:fill-box;animation:leaf 5s ease-in-out infinite}.steam{animation:steam 3.5s ease-in-out infinite}.light{animation:light 6s ease-in-out infinite}@keyframes curtain{50%{transform:skewX(-2.5deg)}}@keyframes leaf{50%{transform:rotate(3deg)}}@keyframes steam{0%,100%{opacity:.1;transform:translateY(4px)}40%{opacity:.7}80%{opacity:.2;transform:translateY(-8px)}}@keyframes light{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(-343 -28)"><g data-part="back"><g id="study-picture" class="painted" transform="translate(353 35) rotate(5)"><path d="M0 4Q17 -1 36 5L39 48Q18 54 0 48Z" fill="#ae8e65"/><path d="M5 9L31 9L34 44L5 44Z" fill="#ebdec0"/><path d="M18 37Q17 27 22 16M19 33Q7 25 13 19Q20 23 19 33M21 25Q30 16 32 24Q28 31 21 25" fill="#94a087" stroke="#879675" stroke-width="1.2"/></g></g></g></svg>