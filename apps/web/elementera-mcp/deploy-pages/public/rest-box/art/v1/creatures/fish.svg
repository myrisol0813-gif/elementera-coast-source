<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 205"><style>#fish{--body:#efb67c;--fin:#db916e;--eye:#625369;animation:swim 4s infinite ease-in-out;transform-origin:160px 104px}#tail{transform-origin:210px 104px;animation:wag .8s infinite ease-in-out}#fin{transform-origin:167px 116px;animation:fin 1.6s infinite ease-in-out}#eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}#bubbles{animation:bubble 3s infinite}@keyframes swim{0%,100%{transform:translate(-5px,3px) rotate(-3deg)}50%{transform:translate(7px,-5px) rotate(3deg)}}@keyframes wag{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.65) rotate(5deg)}}@keyframes fin{50%{transform:rotate(12deg)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.07)}}@keyframes bubble{0%{transform:translateY(8px);opacity:0}30%{opacity:.85}100%{transform:translateY(-14px);opacity:0}}
#fishHappy,#fishSleep,#fishSad,#fishOpen,#fishFrown,#fishHearts,#fishZ,#fishTear{display:none}#fish.cheer #eyes,#fish.sleep #eyes,#fish.sad #eyes,#fish.cheer #fishMouth,#fish.sad #fishMouth,#fish.sleep #fishMouth{display:none}#fish.cheer #fishHappy,#fish.cheer #fishOpen,#fish.sleep #fishSleep,#fish.sleep #fishOpen,#fish.sad #fishSad,#fish.sad #fishFrown,.cling #fishHearts,.sleep #fishZ,.sad #fishTear{display:inline}#fish.cling{animation:fishCling 1.8s infinite ease-in-out}#fish.cheer{animation:fishHop .7s infinite ease-in-out}#fish.cheer #tail{animation-duration:.25s}#fish.sad{animation:fishSad 3s infinite ease-in-out}#fish.sit{animation:fishHover 3.4s infinite ease-in-out}#fish.sleep{animation:fishNap 4s infinite ease-in-out}#fish.sleep #fin,#fish.sleep #tail{animation-duration:4s}#bubbles.cheer{animation-duration:.7s}#bubbles.sleep{opacity:.4;animation-duration:6s}#bubbles.sad{animation-duration:4.5s}@keyframes fishCling{50%{transform:translate(-13px,-3px) rotate(-7deg)}}@keyframes fishHop{50%{transform:translateY(-14px) rotate(-6deg)}}@keyframes fishSad{0%,100%{transform:translateY(7px) rotate(6deg)}50%{transform:translateY(11px) rotate(9deg)}}@keyframes fishHover{50%{transform:translateY(-2px)}}@keyframes fishNap{0%,100%{transform:translateY(12px) rotate(5deg)}50%{transform:translateY(10px) rotate(5deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g id="fish"><g id="tail" fill="var(--fin)"><path d="M205 99C223 79 248 70 259 76Q270 86 249 106Q270 126 259 136C248 142 223 131 205 113Z"/></g><path d="M146 63Q155 38 177 41Q191 45 193 67Z" fill="var(--fin)"/><path d="M141 143Q152 166 175 160Q183 158 190 140Z" fill="var(--fin)"/><path d="M150 54C104 54 74 73 74 106C74 139 104 158 150 158C186 158 221 136 221 106C221 76 186 54 150 54Z" fill="var(--body)"/><g id="fin"><path d="M167 107C188 101 202 113 192 129Q181 142 163 132Q156 120 167 107Z" fill="var(--fin)"/></g><g id="eyes"><ellipse cx="106" cy="98" rx="8.5" ry="11" fill="var(--eye)"/><circle cx="103" cy="94" r="2.8" fill="#fff"/><ellipse cx="137" cy="99" rx="8.5" ry="11" fill="var(--eye)"/><circle cx="134" cy="95" r="2.8" fill="#fff"/></g><ellipse cx="93" cy="117" rx="7" ry="4" fill="#d996a4" opacity=".8"/><ellipse cx="150" cy="118" rx="7" ry="4" fill="#d996a4" opacity=".8"/><path d="M115 114Q121 121 127 114" fill="none" stroke="var(--eye)" stroke-width="3" stroke-linecap="round" id="fishMouth"/><g><g id="fishHappy" fill="none" stroke="var(--eye)" stroke-width="3.6" stroke-linecap="round"><path d="M97 99Q106 86 115 99M128 100Q137 87 146 100"/></g><g id="fishSleep" fill="none" stroke="var(--eye)" stroke-width="3" stroke-linecap="round"><path d="M97 98Q106 108 115 98M128 99Q137 109 146 99"/></g><g id="fishSad" fill="var(--eye)"><path d="M98 85L111 80M132 80L145 85" stroke="var(--eye)" stroke-width="3" stroke-linecap="round"/><ellipse cx="106" cy="100" rx="8" ry="10"/><ellipse cx="137" cy="101" rx="8" ry="10"/><circle cx="104" cy="103" r="2.5" fill="white"/><circle cx="135" cy="104" r="2.5" fill="white"/></g></g><g><ellipse id="fishOpen" cx="121" cy="116" rx="6" ry="5" fill="var(--eye)"/><path id="fishFrown" d="M115 119Q121 111 127 119" fill="none" stroke="var(--eye)" stroke-width="3" stroke-linecap="round"/></g></g><g id="bubbles" fill="none" stroke="#f6f4ff" stroke-width="2"><circle cx="57" cy="97" r="5"/><circle cx="47" cy="78" r="8"/><circle cx="62" cy="58" r="4"/></g><g><g id="fishEmote"><g id="fishHearts" fill="#d891b0"><path d="M56 42Q63 33 70 42Q77 33 84 42Q84 52 70 60Q56 52 56 42Z"/></g><g id="fishZ" fill="#77738d" font-size="18" font-weight="bold"><text x="242" y="48">z</text><text x="263" y="27">Z</text></g><path id="fishTear" d="M142 109Q132 123 142 127Q152 123 142 109Z" fill="#a5c6ed"/></g></g></svg>