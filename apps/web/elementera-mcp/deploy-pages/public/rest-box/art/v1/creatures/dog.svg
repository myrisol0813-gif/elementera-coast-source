<circle cx="-11" cy="-5" r="3.5" fill="var(--pad)"/>
<circle cx="-3" cy="-11" r="3.5" fill="var(--pad)"/>
<circle cx="5" cy="-11" r="3.5" fill="var(--pad)"/>
<circle cx="12" cy="-5" r="3.5" fill="var(--pad)"/>
</g>
<clipPath id="newFaceClip"><path d="M83 119C83 87 104 74 139 72Q143 67 141 61Q154 62 160 71Q170 63 178 67L177 73C216 73 237 92 237 121C237 158 207 179 160 179C113 179 83 158 83 119Z" fill="black"/></clipPath><clipPath id="wardBodyClip"><path d="M160 111C127 111 112 145 116 178Q117 197 133 207Q133 216 145 216Q154 216 154 210Q160 211 166 210Q166 216 175 216Q187 216 187 207Q203 197 204 178C208 145 193 111 160 111Z" fill="black"/></clipPath></defs>
<ellipse cx="160" cy="222" rx="69" ry="7" fill="#55576e" opacity=".17"/>
<g id="scene" class="idle collie" style="--fur:#41404b;--body:#383741;--inner:#a7889b;--tail:#41404b;--cheek:#fffaf4;--belly:#f0eae4;--paw:#e2dce0;--eye:#ad8e65;--ink:#35333d;--pad:#d5a0ae;--blush:#d5a0ae">
<g id="pet">
<g id="tail">
<path d="M185 185C207 185 223 173 234 157Q244 141 243 127C260 136 270 153 267 166Q275 163 273 172Q271 183 258 190Q267 191 258 199Q247 207 233 207Q242 213 228 216Q202 221 185 204Z" fill="var(--tail)"/></g>
<path d="M160 111C127 111 112 145 116 178Q117 197 133 207Q133 216 145 216Q154 216 154 210Q160 211 166 210Q166 216 175 216Q187 216 187 207Q203 197 204 178C208 145 193 111 160 111Z" fill="var(--body)"/>
<g><path d="M147 143Q160 134 173 143C179 159 180 178 176 191Q172 202 160 203Q148 202 144 191C140 178 141 159 147 143Z" fill="var(--belly)"/></g><g transform="translate(0 -14)">
<g id="headTilt">
<g><g id="earL"><path d="M86 113C77 96 73 65 79 43Q82 31 91 37C111 49 129 68 141 91L117 114Z" fill="var(--fur)"/><path d="M90 91C85 78 82 61 86 49Q87 46 91 49C105 59 116 73 124 88Q108 88 97 100Z" fill="var(--inner)"/></g><g id="earR" transform="translate(320 0) scale(-1 1)"><path d="M86 113C77 96 73 65 79 43Q82 31 91 37C111 49 129 68 141 91L117 114Z" fill="var(--fur)"/><path d="M90 91C85 78 82 61 86 49Q87 46 91 49C105 59 116 73 124 88Q108 88 97 100Z" fill="var(--inner)"/></g></g><g><path d="M83 119C83 87 104 74 139 72Q143 67 141 61Q154 62 160 71Q170 63 178 67L177 73C216 73 237 92 237 121C237 158 207 179 160 179C113 179 83 158 83 119Z" fill="var(--fur)"/></g><g><g clip-path="url(#newFaceClip)"><path class="collieMark" d="M148 54Q153 79 145 94Q140 110 145 129Q125 137 108 135Q87 132 72 140V196H248V140Q233 132 212 135Q195 137 175 129Q180 110 175 94Q167 79 172 54Z" fill="var(--cheek)"/><g class="tanMark" fill="var(--cheek)"><ellipse cx="134" cy="103" rx="10" ry="5.5"/><ellipse cx="186" cy="103" rx="10" ry="5.5"/><path d="M72 144Q99 145 111 135C114 122 121 116 134 116C147 116 153 128 155 141Q160 147 165 141C167 128 173 116 186 116C199 116 206 122 209 135Q221 145 248 144V196H72Z"/></g><g class="shepherdMark"><path d="M72 143Q97 144 109 133C111 113 115 98 130 97C145 95 152 110 153 128Q160 134 167 128C168 110 175 95 190 97C205 98 209 113 211 133Q223 144 248 143V196H72Z" fill="var(--cheek)"/><path d="M160 127C147 127 138 140 132 152C126 167 139 174 160 174C181 174 194 167 188 152C182 140 173 127 160 127Z" fill="var(--fur)"/></g></g></g><g id="eyes" fill="var(--eye)">
<ellipse cx="137" cy="132" rx="9" ry="12"/><ellipse cx="183" cy="132" rx="9" ry="12"/>
<circle cx="134" cy="128" r="2.5" fill="white"/><circle cx="180" cy="128" r="2.5" fill="white"/>
</g>
