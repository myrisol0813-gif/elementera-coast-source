<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250"><style>#pet{transform-origin:160px 220px;animation:breathe 3.2s infinite ease-in-out}#head{transform-origin:160px 151px;transition:transform .45s ease}#eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}#wingL{transform-origin:123px 169px}#wingR{transform-origin:197px 169px}#wingL,#wingR{transition:transform .35s ease}#happyEyes,#sleepEyes,#sadEyes,#hearts,#stars,#openBeak,#sleepBody,#nestBack,#nestFront,#zzz,#tear{display:none}.cling #head{animation:nuzzle 1.9s infinite ease-in-out}.cling #hearts{display:inline}.cling #wingL{transform:rotate(-12deg)}.cling #wingR{transform:rotate(12deg)}.cheer #pet{animation:hop .75s infinite ease-in-out}.cheer #wingL{animation:flapL .35s infinite ease-in-out}.cheer #wingR{animation:flapR .35s infinite ease-in-out}.cheer #eyes,.cheer #beak,.sleep #eyes,.sad #eyes{display:none}.cheer #happyEyes,.cheer #stars,.cheer #openBeak,.sleep #sleepEyes,.sleep #zzz,.sad #sadEyes,.sad #tear{display:inline}.sad #head{transform:translateY(7px) rotate(-4deg)}.sad #pet{animation:sigh 3s infinite}.sad #wingL{transform:rotate(-9deg)}.sad #wingR{transform:rotate(9deg)}.sit #pet{animation:sit 3s infinite}.sleep #standingBody,.sleep #awakeShadow{display:none}.sleep #sleepBody,.sleep #nestBack,.sleep #nestFront{display:inline}.sleep #head{transform:translateY(27px) rotate(-4deg)}.sleep #pet{animation:nap 4s infinite ease-in-out}#hearts,#stars,#zzz{animation:float 2.8s infinite}#tear{animation:tear 3s infinite}@keyframes breathe{50%{transform:scale(1.012,.98)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.07)}}@keyframes nuzzle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes hop{0%,100%{transform:scale(1.04,.96)}50%{transform:translateY(-17px) scale(.98,1.02)}}@keyframes flapL{0%,100%{transform:rotate(20deg)}50%{transform:rotate(105deg)}}@keyframes flapR{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-105deg)}}@keyframes float{50%{transform:translateY(-5px);opacity:.65}}@keyframes nap{0%,100%{transform:scale(1,.985)}50%{transform:scale(1.015,1.005)}}@keyframes sit{50%{transform:scale(1.035,.94)}}@keyframes sigh{0%,100%{transform:scale(1.02,.96)}50%{transform:scale(1.04,.93)}}@keyframes tear{0%,15%{opacity:0}35%{opacity:1}85%,100%{opacity:0;transform:translateY(8px)}}
