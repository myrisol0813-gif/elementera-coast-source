[package]
name = "coast_native_art"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
rusty-leveldb = "=4.0.1"
resvg = { version = "=0.49.0", default-features = false, features = ["text"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
