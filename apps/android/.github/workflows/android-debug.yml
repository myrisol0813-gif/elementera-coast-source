name: Source Android debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.elementeracoast.source"' app/build.gradle.kts
          grep -Fq 'versionCode = 1' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.0-source"' app/build.gradle.kts
          ! grep -Fq 'https://app.elementeracoast.com' app/build.gradle.kts
          ! grep -R -q 'REQUEST_INSTALL_PACKAGES' app/src/main
          ! grep -R -q 'NativeApkInstaller' app/src/main

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble source debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage source debug artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/elementera-coast-source-v0.1-debug.apk
          sha256sum artifact/elementera-coast-source-v0.1-debug.apk > artifact/SHA256SUMS.txt
          printf 'applicationId=com.elementeracoast.source\nversionCode=1\nversionName=0.1.0-source\nofficial_production_apk=false\n' > artifact/BUILD_INFO.txt

      - name: Upload source debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: elementera-coast-source-debug-apk
          path: |
            artifact/elementera-coast-source-v0.1-debug.apk
            artifact/SHA256SUMS.txt
            artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
