name: Source smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-smoke:
    name: Web / PWA smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps/web -type f -name '*.js' -print0)

      - name: Check relative imports and service-worker assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else out.push(full);
            }
            return out;
          }

          const files = walk(path.join(root, 'apps/web'));
          const relative = new Set(files.map((file) => path.relative(root, file).replaceAll('\\', '/')));
          const missing = [];

          for (const file of files.filter((item) => item.endsWith('.js'))) {
            const content = fs.readFileSync(file, 'utf8');
            const re = /(?:import|export)\s+(?:[^'"]*?\s+from\s+)?['"](\.[^'"]+)['"]/g;
            for (const match of content.matchAll(re)) {
              const candidate = path.resolve(path.dirname(file), match[1]);
              const tries = [candidate, candidate + '.js', path.join(candidate, 'index.js')]
                .map((item) => path.relative(root, item).replaceAll('\\', '/'));
              if (!tries.some((item) => relative.has(item))) {
                missing.push(path.relative(root, file) + ' -> ' + match[1]);
              }
            }
          }

          const sw = fs.readFileSync(path.join(root, 'apps/web/service-worker.js'), 'utf8');
          const assets = [...sw.matchAll(/"([^"]+)"/g)]
            .map((match) => match[1])
            .filter((item) => item.startsWith('/'));
          const missingAssets = assets.filter((asset) => {
            if (asset === '/') return !relative.has('apps/web/index.html');
            return !relative.has('apps/web' + asset);
          });

          if (missing.length || missingAssets.length) {
            console.error({ missingImports: missing, missingServiceWorkerAssets: missingAssets });
            process.exit(1);
          }
          console.log('Relative imports: OK');
          console.log('Service worker assets: ' + assets.length + ' / ' + assets.length + ' present');
          NODE

      - name: Check source hygiene
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const roots = ['apps/web', 'apps/android'];
          const legacy = [
            '小寒','Myri','Myrisol','Myraes','先生','狗话','小狼窝','小蛇书桌','小蛇行动日志',
            '海岸信箱','海岸屋主','同轨','8.12','8.13','模型回波','本轮桌面','家具',
            '粉嫩 Myri','白狼雪野','雪地来信','mailbox-snake','horned','serpent','wolf',
            'RikkaHub','app.elementeracoast.com','com.elementeracoast.app','Assistant','助手',
          ];
          const textExtensions = new Set([
            '.js','.mjs','.cjs','.ts','.tsx','.jsx','.html','.css','.json','.jsonc','.xml',
            '.kt','.kts','.gradle','.properties','.toml','.txt','.md',
          ]);
          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else out.push(full);
            }
            return out;
          }
          const findings = [];
          for (const root of roots) {
            for (const file of walk(root)) {
              if (!textExtensions.has(path.extname(file))) continue;
              const content = fs.readFileSync(file, 'utf8');
              for (const term of legacy) {
                if (content.includes(term)) findings.push({ file, term });
              }
            }
          }
          if (findings.length) {
            console.error('Legacy/private concept findings in business files:', findings);
            process.exit(1);
          }
          console.log('Business-file legacy/private concept scan: OK');
          NODE

      - name: Prepare local source variables
        shell: bash
        run: |
          cat > apps/web/.dev.vars <<'EOF'
          SOURCE_ACCESS_PASSWORD=source-test-pass
          COAST_SESSION_SECRET=source-test-session-secret-0123456789abcdef
          EOF

      - name: Start Cloudflare Pages locally
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/web && npx --yes wrangler@latest pages dev . \
            --port 8788) > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/login >/tmp/login.html; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/wrangler.log
          exit 1

      - name: Smoke owner login and source surfaces
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8788

          grep -q "Elementera Coast Source" /tmp/login.html

          root_status=$(curl -sS -o /dev/null -w '%{http_code}' "$base/")
          test "$root_status" = "302"

          curl -sS -D /tmp/owner-login.headers -o /dev/null \
            -X POST \
            --data-urlencode 'password=source-test-pass' \
            "$base/login"

          OWNER_COOKIE=$(awk 'BEGIN{IGNORECASE=1} /^set-cookie:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); split($0,a,";"); print a[1]; exit}' /tmp/owner-login.headers)
          test -n "$OWNER_COOKIE"

          owner_curl() {
            curl -fsS -H "Cookie: $OWNER_COOKIE" "$@"
          }

          owner_curl "$base/" >/tmp/app.html
          grep -q "主聊天" /tmp/app.html
          grep -q "访客信箱" /tmp/login.html
          grep -q "人类思考链" /tmp/app.html
          grep -q "本轮上下文" /tmp/app.html
          grep -q "小组件" /tmp/app.html
          grep -q "模型工作台" /tmp/app.html

          owner_curl -H 'Content-Type: application/json' \
            -d '{"title":"Source smoke","room_type":"main"}' \
            "$base/api/chat/conversations" >/tmp/conversation.json

          CONVERSATION_ID=$(node -e "const x=require('/tmp/conversation.json'); if(!x.conversation?.id) process.exit(1); process.stdout.write(x.conversation.id)")
          test -n "$CONVERSATION_ID"

          owner_curl "$base/api/chat/history?conversation_id=$CONVERSATION_ID" >/tmp/history.json
          owner_curl "$base/api/human-thought?conversation_id=$CONVERSATION_ID" >/tmp/human-thought.json
          owner_curl -X PUT -H 'Content-Type: application/json' \
            -d '{"conversation_id":"'"$CONVERSATION_ID"'","content":"synthetic smoke note","read_mode":"read_now"}' \
            "$base/api/human-thought" >/tmp/human-thought-write.json

          owner_curl "$base/api/memory/soil?conversation_id=$CONVERSATION_ID" >/tmp/soil.json
          owner_curl "$base/api/memory/pockets?conversation_id=$CONVERSATION_ID" >/tmp/pockets.json
          owner_curl "$base/api/memory/entries?conversation_id=$CONVERSATION_ID" >/tmp/memory.json
          owner_curl "$base/api/worldbook" >/tmp/worldbook.json
          owner_curl "$base/api/daily/moments" >/tmp/moments.json
          owner_curl "$base/api/daily/diaries" >/tmp/diaries.json
          owner_curl "$base/api/workbench/tools" >/tmp/workbench-tools.json
          owner_curl "$base/api/workbench/dev/self-check" >/tmp/dev-self-check.json
          owner_curl "$base/api/external/status" >/tmp/external-status.json
          owner_curl "$base/api/external/mcp-contract" >/tmp/mcp-contract.json

          owner_curl "$base/api/export/v1-snapshot" >/tmp/snapshot.json
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('/tmp/snapshot.json', 'utf8'));
          if (value.format !== 'elementera-coast-source-snapshot' || value.source_only !== true) process.exit(1);
          if (!value.visitor_mailbox || !Array.isArray(value.visitor_mailbox.visitors)) process.exit(1);
          if (!Array.isArray(value.conversations)) process.exit(1);
          for (const item of value.conversations) {
            if (!Array.isArray(item.turn_context_previews)) process.exit(1);
          }
          const raw = JSON.stringify(value);
          if (raw.includes('source-test-session-secret-0123456789abcdef')) process.exit(1);
          NODE

          chat_status=$(curl -sS -o /tmp/no-key-chat.json -w '%{http_code}' \
            -H "Cookie: $OWNER_COOKIE" \
            -H 'Content-Type: application/json' \
            -d '{"conversation_id":"'"$CONVERSATION_ID"'","messages":[{"role":"user","content":"source smoke"}]}' \
            "$base/api/chat")
          test "$chat_status" = "503"
          grep -q "OpenRouter key" /tmp/no-key-chat.json

      - name: Smoke Visitor Mailbox
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8788

          curl -sS -D /tmp/mailbox-register.headers -o /tmp/mailbox-register.json \
            -H "Origin: $base" \
            -H 'Content-Type: application/json' \
            -d '{"display_name":"Smoke Visitor","preferred_name":"Smoke","passphrase":"source-smoke-passphrase","allow_memory":true}' \
            "$base/api/mailbox/register"

          MAILBOX_COOKIE=$(awk 'BEGIN{IGNORECASE=1} /^set-cookie:/ {sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); split($0,a,";"); print a[1]; exit}' /tmp/mailbox-register.headers)
          test -n "$MAILBOX_COOKIE"

          mailbox_curl() {
            curl -fsS -H "Cookie: $MAILBOX_COOKIE" "$@"
          }

          mailbox_curl "$base/api/mailbox/me" >/tmp/mailbox-me.json
          mailbox_curl "$base/api/mailbox/messages" >/tmp/mailbox-messages.json
          mailbox_curl "$base/api/mailbox/status" >/tmp/mailbox-status.json
          mailbox_curl "$base/api/mailbox/memory" >/tmp/mailbox-memory.json

          mailbox_curl -X POST \
            -H "Origin: $base" \
            -H 'Content-Type: application/json' \
            -d '{"content":"synthetic Visitor Mailbox smoke message"}' \
            "$base/api/mailbox/send" >/tmp/mailbox-send.json

          mailbox_curl "$base/mailbox" >/tmp/mailbox-page.html
          grep -q "访客信箱" /tmp/mailbox-page.html

      - name: Mobile browser smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --no-package-lock playwright-core@latest >/dev/null 2>&1
          CHROME_PATH="$CHROME_PATH" node <<'NODE'
          const { chromium } = require('playwright-core');

          const base = 'http://127.0.0.1:8788';
          const errors = [];
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox'],
          });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const page = await context.newPage();
          page.on('pageerror', (error) => errors.push(String(error?.stack || error)));

          await page.goto(base + '/login', { waitUntil: 'domcontentloaded' });
          await page.locator('input[name="password"]').fill('source-test-pass');
          await Promise.all([
            page.waitForURL(base + '/'),
            page.locator('form[action="/login"] button[type="submit"]').click(),
          ]);
          await page.waitForSelector('#composer[data-ready="true"]', { timeout: 15000 });

          async function reloadReady() {
            await page.goto(base + '/', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#composer[data-ready="true"]', { timeout: 15000 });
          }

          async function invoke(selector) {
            await page.evaluate((value) => {
              const node = document.querySelector(value);
              if (!node) throw new Error('Missing selector: ' + value);
              node.click();
            }, selector);
            await page.waitForTimeout(250);
            if (errors.length) throw new Error(errors.join('\n'));
          }

          const surfaces = [
            'button[data-action="chat:open-type"][data-kind="main"]',
            'button[data-action="chat:open-type"][data-kind="radio"]',
            'button[data-action="chat:open-type"][data-kind="lighthouse"]',
            'button[data-action="external:open"]',
            'button[data-action="memory:open"]',
            'button[data-action="desk:worldbook"]',
            'button[data-action="sourcepages:open-widgets"]',
            'button[data-action="devhands:open"]',
            'button[data-action="toolroom:open"]',
            'button[data-action="sourcepages:themes"]',
            'button[data-action="sourcepages:open-settings"]',
            'button[data-action="desk:open"]',
            '#modelButton',
          ];

          for (const selector of surfaces) {
            await reloadReady();
            await invoke(selector);
          }

          await reloadReady();
          await invoke('#attachmentButton');
          const attachmentOpen = await page.locator('#attachmentMenu').evaluate((node) => !node.hidden);
          if (!attachmentOpen) throw new Error('Attachment menu did not open.');

          const metrics = await page.evaluate(() => ({
            width: innerWidth,
            height: innerHeight,
            hasApp: Boolean(document.querySelector('#app')),
            bodyText: document.body.innerText.length,
          }));
          if (metrics.width !== 390 || metrics.height !== 844 || !metrics.hasApp || metrics.bodyText < 20) {
            throw new Error('Unexpected mobile shell metrics: ' + JSON.stringify(metrics));
          }
          if (errors.length) throw new Error(errors.join('\n'));
          console.log('Mobile browser smoke: OK', metrics);
          await browser.close();
          NODE

      - name: Print Wrangler log on failure
        if: failure()
        shell: bash
        run: cat /tmp/wrangler.log || true

      - name: Stop local Pages process
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/wrangler.pid ]; then
            kill "$(cat /tmp/wrangler.pid)" || true
          fi

  native-debug:
    name: Native debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify source Android identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.elementeracoast.source"' apps/android/app/build.gradle.kts
          grep -q 'versionCode = 1' apps/android/app/build.gradle.kts
          grep -q 'versionName = "0.1.0-source"' apps/android/app/build.gradle.kts
          ! grep -R -n -E 'app\.elementeracoast\.com|com\.elementeracoast\.app' apps/android

      - name: Build debug APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace

      - name: Verify debug APK
        shell: bash
        run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elementera-coast-source-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
