name: Source Native V1 V2 Diagnostic QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-native-v1v2-diagnostic.yml
      - apps/android/scripts/sign-disposable-qa.sh
      - apps/android/scripts/run-signed-qa.sh
      - apps/android/app/src/main/kotlin/com/elementeracoast/app/feature/daily/**
      - apps/android/app/src/main/kotlin/com/elementeracoast/app/ui/theme/**
      - apps/android/app/src/main/kotlin/com/elementeracoast/app/feature/wolf/WolfProfileAppearance.kt
      - apps/android/app/build.gradle.kts
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate temporary PWA and publish signed QA APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apps/android/scripts/run-signed-qa.sh
