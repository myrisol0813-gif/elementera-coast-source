name: Source Native V1 V2 Diagnostic QA
on:
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate temporary PWA and publish signed QA APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apps/android/scripts/run-signed-qa.sh
