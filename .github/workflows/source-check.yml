name: Source check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.elementeracoast.source"' app/build.gradle.kts
          grep -Fq 'versionCode = 1' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.0-source"' app/build.gradle.kts
          ! grep -Fq 'https://app.elementeracoast.com' app/build.gradle.kts
      - run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Stage debug artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/elementera-coast-source-v0.1-debug.apk
          sha256sum artifact/elementera-coast-source-v0.1-debug.apk > artifact/SHA256SUMS.txt
          printf 'applicationId=com.elementeracoast.source\nversionCode=1\nversionName=0.1.0-source\nofficial_production_apk=false\n' > artifact/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elementera-coast-source-debug-apk
          path: |
            apps/android/artifact/elementera-coast-source-v0.1-debug.apk
            apps/android/artifact/SHA256SUMS.txt
            apps/android/artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
