name: Source check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Audit tracked source for private markers
        run: node ../../scripts/source-safety-audit.mjs

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.elementeracoast.source"' app/build.gradle.kts
          grep -Fq 'versionCode = 9' app/build.gradle.kts
          grep -Fq 'versionName = "0.2.7-source"' app/build.gradle.kts
          ! grep -Eiq 'app[.]elementeracoast[.]com' app/build.gradle.kts
      - run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Show build-only result
        run: echo "Android source checks passed; Releases are published separately with stable signing only."
