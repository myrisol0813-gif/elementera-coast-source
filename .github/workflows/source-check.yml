name: Source check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Audit tracked source for private markers
        run: node ../../scripts/source-safety-audit.mjs

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.elementeracoast.source"' app/build.gradle.kts
          grep -Fq 'versionCode = 18' app/build.gradle.kts
          grep -Fq 'versionName = "0.2.16-source"' app/build.gradle.kts
          ! grep -Eiq 'app[.]elementeracoast[.]com' app/build.gradle.kts
      - name: Verify Source visitor release version plumbing
        shell: bash
        run: |
          set -euo pipefail
          workflow="../../.github/workflows/source-native-prerelease.yml"
          grep -Fq 'steps.version_gate.outputs.base_version' "$workflow"
          grep -Fq 'steps.version_gate.outputs.version_code' "$workflow"
          ! grep -Eq 'source-visitor-v0\.[0-9]' "$workflow"
          ! grep -Eq 'elementera-coast-source-v0\.[0-9].*-visitor-qa[.]apk' "$workflow"
      - name: Verify disposable QA signing callers
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/run-live-chatgpt-qa.sh scripts/run-signed-qa.sh; do
            grep -Fq ':app:assembleRelease' "$script"
            grep -Fq 'app/build/outputs/apk/release/app-release-unsigned.apk' "$script"
            grep -Fq 'bash scripts/sign-disposable-qa.sh "$unsigned_apk" "$apk"' "$script"
            ! grep -Fq 'app/build/outputs/apk/debug/app-debug.apk' "$script"
          done
          ! grep -Fq "versionCode='4'" scripts/run-signed-qa.sh
          ! grep -Fq "versionName='0.2.2-source'" scripts/run-signed-qa.sh
      - run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Exercise disposable Release signing
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PSOURCE_TOUR_ENABLED=true \
            -PCOAST_API_BASE_URL=https://elementera-coast-source.invalid
          unsigned_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          signed_apk="$RUNNER_TEMP/source-check-signed.apk"
          test -s "$unsigned_apk"
          bash scripts/sign-disposable-qa.sh "$unsigned_apk" "$signed_apk"
          test -s "$signed_apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --min-sdk-version 23 "$signed_apk" >/dev/null
          badging="$("$build_tools/aapt" dump badging "$signed_apk" | sed -n '1p')"
          [[ "$badging" == *"name='com.elementeracoast.source'"* ]]
          [[ "$badging" == *"versionCode='18'"* ]]
          [[ "$badging" == *"versionName='0.2.16-source'"* ]]
      - name: Show build-only result
        run: echo "Android Source checks passed; Debug and disposable-signed Release packaging both verified."
