name: Publish Source Native visitor QA APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Source check"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: source-native-visitor-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    # The visitor APK is offline-only. No external demo backend, production secrets,
    # stable signing keys, or administrator release flag are needed.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Skip packaging when this Source APK version is already published
        id: version_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | sed -n '1p')"
          : "${version:?Source Android versionName is missing}"
          [[ "$version" == *-source ]] || { echo "Unexpected Source version: $version" >&2; exit 1; }
          release_prefix="source-visitor-v${version%-source}-"
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')"
          if [[ "$tags" == *"$release_prefix"* ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Existing ${version} visitor APK kept; workflow-only edits will not publish another copy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version_gate.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version_gate.outputs.skip != 'true'
        with:
          gradle-version: '8.9'

      - name: Verify visitor-only source build identity
        if: steps.version_gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.elementeracoast.source"' app/build.gradle.kts
          grep -Fq 'versionCode = 12' app/build.gradle.kts
          grep -Fq 'versionName = "0.2.10-source"' app/build.gradle.kts
          test -f scripts/sign-disposable-qa.sh
          ! grep -Eiq 'app[.]elementeracoast[.]com' app/build.gradle.kts

      - name: Build visitor APK and run unit tests
        if: steps.version_gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace \
            -PSOURCE_TOUR_ENABLED=true \
            -PCOAST_API_BASE_URL=https://elementera-coast-source.invalid
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign with a disposable Source-only QA certificate
        if: steps.version_gate.outputs.skip != 'true'
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p source-release
          apk=source-release/elementera-coast-source-v0.2.10-visitor-qa.apk
          # Sign original unsigned Release exactly once, never double-sign Debug.
          bash scripts/sign-disposable-qa.sh "$unsigned_apk" "$apk"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          badging="$("${build_tools}/aapt" dump badging "$apk")"
          line="$(printf '%s\n' "$badging" | sed -n '1p')"
          [[ "$line" == *"name='com.elementeracoast.source'"* ]]
          [[ "$line" == *"versionCode='12'"* ]]
          [[ "$line" == *"versionName='0.2.10-source'"* ]]
          "${build_tools}/apksigner" verify --verbose --print-certs "$apk" > "${RUNNER_TEMP}/source-visitor-apk-certs.txt"
          fingerprint="$(grep -m1 'certificate SHA-256 digest:' "${RUNNER_TEMP}/source-visitor-apk-certs.txt" | awk '{print $NF}')"
          : "${fingerprint:?Missing source certificate fingerprint}"
          echo "fingerprint=$fingerprint" >> "${GITHUB_OUTPUT}"
          (cd source-release && sha256sum elementera-coast-source-v0.2.10-visitor-qa.apk > SHA256SUMS.txt)
          unzip -t "$apk" >/dev/null

      - name: Publish visitor APK directly to Releases
        if: steps.version_gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="source-visitor-v0.2.10-${{ github.event.workflow_run.head_sha || github.sha }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" \
            source-release/elementera-coast-source-v0.2.10-visitor-qa.apk \
            source-release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "Elementera Coast Source Native 0.2.10 · Visitor QA" \
            --latest \
            --notes "Public visitor-only Source Native APK, password 123456. Original Native pages and appearance are retained; remote operations are blocked while visiting. Built against a non-routable .invalid API host; no real account, production backend or model budget is included. QA uses a NEW disposable signing certificate for each build, so it cannot upgrade prior Source APKs with different signing keys. If necessary uninstall ONLY com.elementeracoast.source before installing. Source code and private production app are separate. This is the latest public visitor build, QA-signed with a disposable certificate, not a stable-signed production app."
          echo "### Source visitor APK published" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/elementera-coast-source-v0.2.10-visitor-qa.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: $(cut -d' ' -f1 source-release/SHA256SUMS.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "QA signing cert SHA256: ${{ steps.signing.outputs.fingerprint }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published APK after downloading it from GitHub
        if: steps.version_gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="source-visitor-v0.2.10-${{ github.event.workflow_run.head_sha || github.sha }}"
          apk_name=elementera-coast-source-v0.2.10-visitor-qa.apk
          downloaded="$RUNNER_TEMP/verified-release"
          mkdir -p "$downloaded"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$apk_name" --dir "$downloaded"
          cmp "source-release/$apk_name" "$downloaded/$apk_name"
          (cd "$downloaded" && sha256sum --check "$GITHUB_WORKSPACE/apps/android/source-release/SHA256SUMS.txt")
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --min-sdk-version 26 --print-certs "$downloaded/$apk_name" | tee "$RUNNER_TEMP/published-signature-check.txt"
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/published-signature-check.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/published-signature-check.txt"
          unzip -Z1 "$downloaded/$apk_name" | grep -Fx 'META-INF/CERT.RSA'
          unzip -Z1 "$downloaded/$apk_name" | grep -Fx 'META-INF/CERT.SF'
          unzip -t "$downloaded/$apk_name" >/dev/null
          echo "Published APK redownloaded: SHA-256, V1, V2 and CERT files verified." >> "$GITHUB_STEP_SUMMARY"
