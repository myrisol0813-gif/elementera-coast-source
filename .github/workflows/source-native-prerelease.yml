name: Publish source Native prerelease

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Source check"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ vars.COAST_SOURCE_RELEASE_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require stable source signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COAST_SOURCE_KEYSTORE_BASE64 }}
          COAST_SOURCE_STORE_PASSWORD: ${{ secrets.COAST_SOURCE_STORE_PASSWORD }}
          COAST_SOURCE_KEY_ALIAS: ${{ secrets.COAST_SOURCE_KEY_ALIAS }}
          COAST_SOURCE_KEY_PASSWORD: ${{ secrets.COAST_SOURCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Source signing not configured}"
          : "${COAST_SOURCE_STORE_PASSWORD:?Missing source signing password}"
          : "${COAST_SOURCE_KEY_ALIAS:?Missing source signing alias}"
          : "${COAST_SOURCE_KEY_PASSWORD:?Missing source key password}"
          umask 077
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/source.keystore"
          test -s "${RUNNER_TEMP}/source.keystore"
      - name: Build stable-signed source release
        shell: bash
        env:
          COAST_SOURCE_KEYSTORE_PATH: ${{ runner.temp }}/source.keystore
          COAST_SOURCE_STORE_PASSWORD: ${{ secrets.COAST_SOURCE_STORE_PASSWORD }}
          COAST_SOURCE_KEY_ALIAS: ${{ secrets.COAST_SOURCE_KEY_ALIAS }}
          COAST_SOURCE_KEY_PASSWORD: ${{ secrets.COAST_SOURCE_KEY_PASSWORD }}
          SOURCE_API_BASE_URL: ${{ vars.COAST_SOURCE_API_BASE_URL }}
          SOURCE_DEMO_PROJECT: ${{ vars.COAST_SOURCE_DEMO_PROJECT }}
          SOURCE_DEMO_PASSWORD: ${{ vars.COAST_SOURCE_PREVIEW_PASSWORD_HINT }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_API_BASE_URL}"
          : "${SOURCE_DEMO_PROJECT:?Set the separate Cloudflare Pages demo project name}"
          case "${SOURCE_DEMO_PROJECT}" in
            *-demo) ;;
            *) echo "Source demo project name must end in -demo" >&2; exit 1 ;;
          esac
          # Never sign a public APK against an arbitrary Pages host or an expired Quick Tunnel.
          case "${SOURCE_API_BASE_URL}" in
            "https://${SOURCE_DEMO_PROJECT}.pages.dev"|"https://"*".${SOURCE_DEMO_PROJECT}.pages.dev") ;;
            *) echo "Expected the independent source demo Pages origin (not private Pages or Quick Tunnel)" >&2; exit 1 ;;
          esac
          : "${SOURCE_DEMO_PASSWORD:?Set source preview login hint in repository variables}"
          if [[ "${SOURCE_DEMO_PASSWORD}" != '123456' ]]; then
            echo 'This isolated 0.2.3-source acceptance APK must actually accept demo password 123456' >&2
            exit 1
          fi
          cookie="${RUNNER_TEMP}/source-native-login-cookie"
          trap 'rm -f "${cookie}"' EXIT
          # The actual backend must accept the password and serve D1-backed APIs.
          status="$(curl --silent --show-error --output /dev/null --cookie-jar "${cookie}" --write-out '%{http_code}' --max-time 20 --data-urlencode "password=${SOURCE_DEMO_PASSWORD}" "${SOURCE_API_BASE_URL}/login")"
          if [[ "${status}" != "302" ]]; then
            echo "Demo backend did not accept configured preview password (HTTP ${status})" >&2
            exit 1
          fi
          for endpoint in /api/calendar/entries /api/library/books; do
            status="$(curl --silent --show-error --output /dev/null --cookie "${cookie}" --write-out '%{http_code}' --max-time 20 "${SOURCE_API_BASE_URL}${endpoint}")"
            if [[ "${status}" != "200" ]]; then
              echo "Demo backend unavailable at ${endpoint} (HTTP ${status})" >&2
              exit 1
            fi
          done
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace -PCOAST_API_BASE_URL="${SOURCE_API_BASE_URL}" -PSOURCE_PREVIEW_PASSWORD_HINT="${SOURCE_DEMO_PASSWORD}"
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p source-release
          cp app/build/outputs/apk/release/app-release.apk source-release/elementera-coast-source-v0.2.3.apk
          (cd source-release && sha256sum elementera-coast-source-v0.2.3.apk > SHA256SUMS.txt)
      - name: Verify APK identity and independent signing
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          : "${ANDROID_HOME:?Missing Android SDK}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "${build_tools}/aapt"
          test -x "${build_tools}/apksigner"
          badging="$("${build_tools}/aapt" dump badging "${apk}")"
          package_line="$(printf '%s\n' "${badging}" | sed -n '1p')"
          [[ "${package_line}" == *"name='com.elementeracoast.source'"* ]]
          [[ "${package_line}" == *"versionCode='5'"* ]]
          [[ "${package_line}" == *"versionName='0.2.3-source'"* ]]
          [[ "${badging}" == *"sdkVersion:'26'"* ]]
          [[ "${badging}" == *"targetSdkVersion:'34'"* ]]
          "${build_tools}/apksigner" verify --verbose --print-certs "${apk}" > "${RUNNER_TEMP}/source-signature-verification.txt"
          fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${RUNNER_TEMP}/source-signature-verification.txt" | head -n 1)"
          : "${fingerprint:?Could not verify source APK signing certificate}"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "APK manifest: ${package_line}"
          echo "Signing certificate SHA-256: ${fingerprint}"
      - name: Publish signed prerelease (not an Actions artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="source-v0.2.3-${{ github.event.workflow_run.head_sha || github.sha }}"
          gh release create "${tag}" \
            source-release/elementera-coast-source-v0.2.3.apk \
            source-release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "Elementera Coast Source Native 0.2.3-source" --prerelease \
            --notes "Source-only stable-signed Android build (versionCode 5). Independent demo backend: ${{ vars.COAST_SOURCE_API_BASE_URL }}. Public demo password is only for synthetic data; do not upload private information. Signing cert SHA-256: ${{ steps.apk_verify.outputs.fingerprint }}. Full-file SHA-256 in SHA256SUMS.txt. Do not install over an older debug-signed source APK: uninstall only com.elementeracoast.source if signatures differ. Not the private production app."
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/elementera-coast-source-v0.2.3.apk"
          echo "### Source Native APK published" >> "${GITHUB_STEP_SUMMARY}"
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Direct APK: ${asset_url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "SHA-256: $(cut -d' ' -f1 source-release/SHA256SUMS.txt)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Signing certificate SHA-256: ${{ steps.apk_verify.outputs.fingerprint }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Source-only package, independent demo backend; installation and UI still require real-device acceptance." >> "${GITHUB_STEP_SUMMARY}"
