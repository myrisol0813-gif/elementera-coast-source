name: Publish source Native prerelease

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Source check"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ vars.COAST_SOURCE_RELEASE_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require stable source signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COAST_SOURCE_KEYSTORE_BASE64 }}
          COAST_SOURCE_STORE_PASSWORD: ${{ secrets.COAST_SOURCE_STORE_PASSWORD }}
          COAST_SOURCE_KEY_ALIAS: ${{ secrets.COAST_SOURCE_KEY_ALIAS }}
          COAST_SOURCE_KEY_PASSWORD: ${{ secrets.COAST_SOURCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Source signing not configured}"
          : "${COAST_SOURCE_STORE_PASSWORD:?Missing source signing password}"
          : "${COAST_SOURCE_KEY_ALIAS:?Missing source signing alias}"
          : "${COAST_SOURCE_KEY_PASSWORD:?Missing source key password}"
          umask 077
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/source.keystore"
          test -s "${RUNNER_TEMP}/source.keystore"
      - name: Build isolated visit-only Source APK
        shell: bash
        env:
          COAST_SOURCE_KEYSTORE_PATH: ${{ runner.temp }}/source.keystore
          COAST_SOURCE_STORE_PASSWORD: ${{ secrets.COAST_SOURCE_STORE_PASSWORD }}
          COAST_SOURCE_KEY_ALIAS: ${{ secrets.COAST_SOURCE_KEY_ALIAS }}
          COAST_SOURCE_KEY_PASSWORD: ${{ secrets.COAST_SOURCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # No live demo backend is needed: 123456 only opens a local, read-only
          # tour; outgoing Source HTTP calls are blocked while touring.
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace -PSOURCE_TOUR_ENABLED=true
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p source-release
          cp app/build/outputs/apk/release/app-release.apk source-release/elementera-coast-source-v0.2.6-visitor.apk
          (cd source-release && sha256sum elementera-coast-source-v0.2.6-visitor.apk > SHA256SUMS.txt)
      - name: Verify APK identity and independent signing
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          : "${ANDROID_HOME:?Missing Android SDK}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "${build_tools}/aapt"
          test -x "${build_tools}/apksigner"
          badging="$("${build_tools}/aapt" dump badging "${apk}")"
          package_line="$(printf '%s\n' "${badging}" | sed -n '1p')"
          [[ "${package_line}" == *"name='com.elementeracoast.source'"* ]]
          [[ "${package_line}" == *"versionCode='8'"* ]]
          [[ "${package_line}" == *"versionName='0.2.6-source'"* ]]
          [[ "${badging}" == *"sdkVersion:'26'"* ]]
          [[ "${badging}" == *"targetSdkVersion:'34'"* ]]
          "${build_tools}/apksigner" verify --verbose --print-certs "${apk}" > "${RUNNER_TEMP}/source-signature-verification.txt"
          fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${RUNNER_TEMP}/source-signature-verification.txt" | head -n 1)"
          : "${fingerprint:?Could not verify source APK signing certificate}"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "APK manifest: ${package_line}"
          echo "Signing certificate SHA-256: ${fingerprint}"
      - name: Publish signed prerelease (not an Actions artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="source-v0.2.6-${{ github.event.workflow_run.head_sha || github.sha }}"
          gh release create "${tag}" \
            source-release/elementera-coast-source-v0.2.6-visitor.apk \
            source-release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "Elementera Coast Source Native 0.2.6-source" --prerelease \
            --notes "Source-only stable-signed Android visitor APK (versionCode 8). Public local tour passcode 123456, no backend authentication, no remote API requests while touring. Pages remain intact; cloud-dependent operations are not available in tour mode. Signing cert SHA-256: ${{ steps.apk_verify.outputs.fingerprint }}. Full-file SHA-256 in SHA256SUMS.txt. To install over an older QA/debug source APK, signatures must match; otherwise uninstall only com.elementeracoast.source. Not the private production app."
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/elementera-coast-source-v0.2.6-visitor.apk"
          echo "### Source Native APK published" >> "${GITHUB_STEP_SUMMARY}"
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Direct APK: ${asset_url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "SHA-256: $(cut -d' ' -f1 source-release/SHA256SUMS.txt)" >> "${GITHUB_STEP_SUMMARY}"
          echo "Signing certificate SHA-256: ${{ steps.apk_verify.outputs.fingerprint }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Source-only package, independent demo backend; installation and UI still require real-device acceptance." >> "${GITHUB_STEP_SUMMARY}"
