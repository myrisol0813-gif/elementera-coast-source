name: Live ChatGPT Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-live-chatgpt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-chatgpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build live ChatGPT test APK and open temporary backend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apps/android/scripts/run-live-chatgpt-qa.sh
